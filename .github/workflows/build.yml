name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.x

      - name: Build
        run: dotnet build -c Release -p:LangVersion=preview --verbosity normal

      - name: Pack NuGet
        working-directory: ./SSMP
        run: dotnet pack -o nuget/

      - name: Upload SSMP artifact
        uses: actions/upload-artifact@v7
        with:
          name: SSMP
          path: ${{ github.workspace }}/bin/Release/netstandard2.1/

      # Upload the NuGet package
      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          path: SSMP/nuget/*.nupkg
          archive: false
